name: Mesa
description: Software OpenGL, for a runner that has no GPU to give LÖVE a context.

# The same Mesa build upstream LÖVE's CI installs on its Windows runners.
runs:
  using: composite
  steps:
    - shell: cmd
      run: |
        curl -L --output mesa.7z --url https://github.com/pal1000/mesa-dist-win/releases/download/24.2.4/mesa3d-24.2.4-release-msvc.7z
        7z x mesa.7z -o*
        powershell.exe mesa\systemwidedeploy.cmd 1
