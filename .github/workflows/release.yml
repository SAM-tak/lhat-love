# Builds the binaries a release consists of, and attaches them to it.
#
# A release carries two builds of the same source revision:
#
#   relwithdebinfo    the full engine: L^ front end and debugger, with
#                     symbols. What a game is developed and compiled with.
#   vmonly-shipping   the runtime a compiled game ships on: no front end, no
#                     debugger.
#
# Only what passed goes out: build.yml runs the test suite on both, and the
# publish job does not start unless it did.
name: release

on:
  push:
    tags: ['v*']
  # Buildable without a tag, to check the workflow itself. Nothing is
  # published then: the publish job is what a tag adds.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    # A tag is what makes this a release; workflow_dispatch only proves the
    # build still works.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create, on the tag that started this
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: package
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: build-info
          path: info

      # The archives are named for what they are; the release they are
      # attached to names the version, and a download loses that.
      - name: Name the archives for the tag
        run: |
          cd dist
          for f in lhat-love-*.zip; do
            mv "$f" "lhat-love-${GITHUB_REF_NAME}-${f#lhat-love-}"
          done
          ls -l

      # Tags are v<LOVE major>.<LOVE minor>.<build>. A tag with a pre-release
      # part (v12.0.0-alpha.1) is published as a pre-release, which is what
      # every release is while LOVE 12.0 itself is still in development.
      # The revisions the build took (lhat.rev and megasource.rev pin them)
      # go into the notes, so the release says what it was made from.
      - name: Attach to the release
        run: |
          {
            echo 'LÔVE: LÖVE 12.0 with L^ (https://github.com/SAM-tak/lhat) in place of Lua.'
            case "$GITHUB_REF_NAME" in
              *-*) echo 'A pre-release, on LÖVE 12.0 as it stands in development upstream -- not a LÖVE release.' ;;
            esac
            echo
            echo '```'
            cat info/build-info.txt
            echo '```'
          } > notes.md
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" $prerelease --generate-notes \
              --notes-file notes.md dist/*
          fi
        env:
          GH_TOKEN: ${{ github.token }}
