name: build-unix

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x64
    defaults:
      run:
        shell: bash
    env:
      ALSOFT_CONF: ${{ github.workspace }}/lhat-love/testing/resources/alsoft.conf
      CC: clang
      CXX: clang++
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v5
        with:
          path: lhat-love

      - name: Read the runtime pin
        id: pins
        run: |
          pin=$(tr -d '\r\n' < lhat-love/lhat.rev)
          [[ "$pin" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "lhat=$pin" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          repository: SAM-tak/lhat
          ref: ${{ steps.pins.outputs.lhat }}
          path: lhat

      - name: Checkout SDL 3.4.10
        uses: actions/checkout@v5
        with:
          repository: libsdl-org/SDL
          ref: 8e37db5e797b6167f3a00d697d816a684bd259c7
          path: SDL

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config patchelf xvfb xauth \
            libfreetype-dev libharfbuzz-dev libopenal-dev libmodplug-dev \
            libtheora-dev libvorbis-dev libogg-dev zlib1g-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libasound2-dev libpulse-dev \
            libwayland-dev libxkbcommon-dev libdecor-0-dev libudev-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgl1-mesa-dri

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ninja pkgconf freetype harfbuzz openal-soft libmodplug theora libvorbis libogg dylibbundler
          echo "CMAKE_PREFIX_PATH=$(brew --prefix);$(brew --prefix openal-soft)" >> "$GITHUB_ENV"

      - name: Build SDL
        run: |
          cmake -S SDL -B build-sdl -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/deps" -DCMAKE_INSTALL_LIBDIR=lib \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF
          cmake --build build-sdl --parallel 3
          cmake --install build-sdl

      - name: Check Linux package relocation
        if: runner.os == 'Linux'
        run: python3 lhat-love/testing/test_package_unix.py

      - name: Build, package and test both variants
        timeout-minutes: 60
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            # SDL ignores the runner's C locale. The suite expects a preferred language.
            export LANGUAGE=en_US
            xvfb-run -a bash lhat-love/scripts/build-unix.sh
          else
            bash lhat-love/scripts/build-unix.sh
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.platform }}
          path: dist/lhat-love-*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: build-info-${{ matrix.platform }}
          path: build-info-${{ matrix.platform }}.txt
          if-no-files-found: error
          retention-days: 14
